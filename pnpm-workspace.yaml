packages:
  - "apps/*"
  - "packages/*"
  # O ponta a ponta mora na RAIZ, e não dentro de um app: ele atravessa o site
  # e a API ao mesmo tempo, e pendurá-lo em um dos dois faria parecer que ele
  # pertence àquele lado.
  - "e2e"

# Catálogo de versões: uma versão por biblioteca no monorepo inteiro.
# Evita a classe de bug em que o site usa uma versão e a API usa outra da
# mesma biblioteca, que só aparece em produção.
catalog:
  typescript: 6.0.3
  eslint: 10.12.0
  typescript-eslint: 8.71.2
  vitest: 5.0.4
  prettier: 3.9.10
  zod: 4.6.7
  # Animação por rolagem, só nas landings. O ScrollTrigger vem no mesmo
  # pacote e é livre desde 2024 — não há plugin pago a instalar.
  gsap: 3.15.0
  # Mundo em três dimensões, SÓ na landing da plataforma. A regra do peso da
  # skill de design proíbe na vitrine, no carrinho e no painel.
  three: 0.186.1
  # Compartilhadas por vários pacotes do monorepo.
  pg: 8.23.1
  "@types/pg": 8.23.1
  "@types/node": 26.6.5
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Prisma fica no 7.x: o 8 ainda é release candidate.
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  prisma: 7.10.0

# Só estes pacotes podem rodar script na instalação. Qualquer outro que peça
# execução precisa ser aprovado aqui, de propósito — é superfície de ataque de
# cadeia de suprimentos, não detalhe de configuração.
allowBuilds:
  unrs-resolver: true # binário nativo que resolve importações em TypeScript
  # Recusa explícita, e não omissão. O Prisma 7 não tem mais motor em Rust: o
  # que estes scripts de instalação fariam é baixar os binários do motor de
  # esquema, usados só por `prisma migrate` — comando que este projeto nunca
  # roda, porque as migrações são escritas à mão (decisão de 17/08, regra 5).
  # Negar aqui mantém a instalação silenciosa e sem binário vindo da rede.
  prisma: false
  "@prisma/engines": false
  # Também recusa explícita. `msgpackr-extract` chega pela BullMQ e é apenas um
  # acelerador nativo opcional do empacotador de mensagens: sem ele o `msgpackr`
  # usa o caminho em JavaScript puro e a fila funciona igual. Negar evita
  # compilação de C++ na máquina de quem clona, por um ganho que a fila de
  # e-mail deste projeto nunca vai sentir.
  msgpackr-extract: false
  lefthook: set this to true or false
