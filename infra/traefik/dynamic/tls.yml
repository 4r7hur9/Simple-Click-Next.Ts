# Certificado de desenvolvimento e política de TLS.
#
# O par de arquivos é gerado por infra/scripts/certs.sh e cobre *.localhost —
# um certificado curinga serve app.localhost e api.localhost ao mesmo tempo,
# que é a topologia decidida para produção (dois nomes sob um domínio comum).
# Os arquivos não são versionados: cada máquina gera os seus.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/localhost.crt
        keyFile: /etc/traefik/certs/localhost.key

  certificates:
    - certFile: /etc/traefik/certs/localhost.crt
      keyFile: /etc/traefik/certs/localhost.key
      stores:
        - default

  options:
    default:
      # Mesma exigência que vale em produção. Se um cliente só fala TLS antigo,
      # é melhor descobrir agora do que na publicação.
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
