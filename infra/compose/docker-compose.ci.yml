# Ambiente mínimo do portão de qualidade: só o que os testes de integração
# precisam tocar de verdade — banco de teste e cache.
#
# Não existe roteador aqui: o portão fala com os serviços por endereço e porta,
# nunca por nome de host com TLS. Isso mantém a execução rápida e remove a
# dependência do certificado local, que é assunto do ambiente de trabalho.
#
# Uso:
#   docker compose -p simpleclick-ci -f infra/compose/docker-compose.ci.yml up -d --wait
#
# O `-p` não é enfeite: a variável COMPOSE_PROJECT_NAME do ambiente tem
# precedência sobre o `name` declarado aqui. Sem o `-p`, quem tivesse o ambiente
# de trabalho no ar veria os contêineres de nome igual brigarem entre si.

name: simpleclick-ci

services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO_TEST:?defina POSTGRES_USUARIO_TEST no ambiente}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA_TEST:?defina POSTGRES_SENHA_TEST no ambiente}
      POSTGRES_DB: ${POSTGRES_BANCO_TEST:?defina POSTGRES_BANCO_TEST no ambiente}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      PGDATA: /var/lib/postgresql/efemero
    ports:
      - "${PORTA_POSTGRES_TEST:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/efemero:size=1g
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: "no"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_SENHA:?defina REDIS_SENHA no ambiente}
      - --appendonly
      - "no"
      - --save
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_SENHA:?defina REDIS_SENHA no ambiente}
    ports:
      - "${PORTA_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
