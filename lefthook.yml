# Ganchos locais — o portão de qualidade roda nesta máquina, sem serviço externo.
# Decisão registrada em .spec/design/decisoes.md (17/08/2026).
#
# A divisão entre os dois ganchos é de CUSTO, não de rigor:
#   - antes do registro (pre-commit) roda o que responde em segundos, sobre o
#     que mudou. Ele não pode ser caro, senão vira LEFTHOOK=0 todo dia (AC-040).
#   - antes do envio (pre-push) roda o portão INTEIRO e bloqueia. É a última
#     porta antes de o histórico remoto receber qualquer coisa (AC-041).
#
# Como funciona por dentro, e o que fazer quando reprova: docs/verificacao.md.

# ── antes de registrar no histórico: só o rápido, só o que mudou (AC-040) ──
pre-commit:
  parallel: true
  commands:
    formatacao:
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml,css}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    qualidade:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm eslint --max-warnings=0 {staged_files}
    # Tipos do que mudou. É o Turborepo que faz o recorte: pacote sem alteração
    # sai do cache em milissegundos, e só o afetado paga o `tsc`. Pedir o
    # monorepo inteiro é o jeito CORRETO de pedir "o que mudou" aqui — recortar
    # por arquivo daria um `tsc` sem o projeto em volta, que acusa erro onde não
    # há e deixa passar o erro que a mudança causou no vizinho.
    tipos:
      glob: "*.{ts,tsx}"
      run: pnpm turbo run typecheck
    segredos:
      run: bash infra/scripts/check-segredos.sh {staged_files}
    # Dívida de portão pulado vira linha em docs/pendencias.md e entra NESTE
    # commit (AC-043). Roda por último em custo: só compara duas listas.
    # `LEFTHOOK=0 git push` desliga o lefthook no push, e não no commit — é por
    # isso que o registro mora aqui, e não lá. Nunca reprova o commit: dívida
    # que bloqueia trabalho é dívida que alguém apaga.
    registro-de-pulo:
      run: bash infra/scripts/registrar-pulo.sh

# A mensagem cita a tarefa: "T-003 fundacao: ..." (1 tarefa = 1 commit).
commit-msg:
  commands:
    formato-da-mensagem:
      run: bash infra/scripts/check-mensagem.sh {1}

# ── antes de enviar: o portão inteiro, e ele bloqueia (AC-041) ─────────────
# Uma linha só de propósito: a lista de etapas mora em verificar.sh, e é lá que
# ela cresce. Assim o gancho nunca fica devendo uma etapa nova.
#
# Para pular em situação excepcional: LEFTHOOK=0 git push. Funciona, exige o
# ato deliberado de escrever a variável, e o próximo commit registra a dívida
# em docs/pendencias.md (AC-043).
pre-push:
  piped: true
  commands:
    portao-completo:
      run: bash infra/scripts/verificar.sh
